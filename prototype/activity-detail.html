<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Running — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet side rail, borderless tonal surfaces on a tinted ground,
   one pastel per kind of information (lavender pace, rose heart, mint cadence, sky distance, peach effort). */
:root{
  --bg:#F4F3F9; --surface:#FFFFFF; --surface-2:#EFEEF7; --surface-3:#E6E4F2;
  --ink:#1E1B2E; --ink-2:#54506B; --ink-3:#6A6682;
  --accent:#6252DE; --accent-soft:#E7E3FC; --on-accent:#FFFFFF;
  --p-lav:#E7E3FC; --p-mint:#D6F3E5; --p-peach:#FFE4D3; --p-sky:#D8EAFB; --p-butter:#FBF1C9; --p-rose:#FCDFE7;
  --i-lav:#5446C9; --i-mint:#1B7550; --i-peach:#A94F1C; --i-sky:#1D639F; --i-butter:#7D6000; --i-rose:#A82C5A;
  --c-rose:#E46F90; --c-mint:#35AF80; --c-sky:#4A97D8; --c-peach:#EE8A4C;
  --z1:#A3ABC8; --z2:#7DB7F0; --z3:#6FD0A3; --z4:#FFAE70; --z5:#F58AA5;
  --pace-fast:#6252DE; --pace-mid:#4FC3A8; --pace-slow:#FFB26B;
  --map-land:#ECEBF4; --map-park:#D9F0E2; --map-water:#D3E6FA; --map-road:#FFFFFF; --map-label:#6A6682;
  --shadow:0 12px 32px rgba(70,58,140,.07);
  --pop:0 16px 48px rgba(40,30,90,.18);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xl:28px; --r-lg:20px; --r-md:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121118; --surface:#1B1A25; --surface-2:#252431; --surface-3:#302F3F;
    --ink:#F2F0FA; --ink-2:#BDB9D1; --ink-3:#9F9BB6;
    --accent:#A99BFF; --accent-soft:#2D2A4B; --on-accent:#15122B;
    --p-lav:#2C2949; --p-mint:#1C372E; --p-peach:#3F2D20; --p-sky:#1C2F44; --p-butter:#38321A; --p-rose:#40222E;
    --i-lav:#BDB2FF; --i-mint:#8FE0BB; --i-peach:#FFC39C; --i-sky:#9CCBF7; --i-butter:#EFD877; --i-rose:#F7AFC3;
    --c-rose:#F58AA5; --c-mint:#6FD0A3; --c-sky:#7DB7F0; --c-peach:#FFAE70;
    --pace-fast:#A99BFF; --pace-mid:#5FD6BB; --pace-slow:#FFC08A;
    --map-land:#191822; --map-park:#1B2E29; --map-water:#1B2A40; --map-road:#292836; --map-label:#9F9BB6;
    --shadow:none; --pop:0 16px 48px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121118; --surface:#1B1A25; --surface-2:#252431; --surface-3:#302F3F;
  --ink:#F2F0FA; --ink-2:#BDB9D1; --ink-3:#9F9BB6;
  --accent:#A99BFF; --accent-soft:#2D2A4B; --on-accent:#15122B;
  --p-lav:#2C2949; --p-mint:#1C372E; --p-peach:#3F2D20; --p-sky:#1C2F44; --p-butter:#38321A; --p-rose:#40222E;
  --i-lav:#BDB2FF; --i-mint:#8FE0BB; --i-peach:#FFC39C; --i-sky:#9CCBF7; --i-butter:#EFD877; --i-rose:#F7AFC3;
  --c-rose:#F58AA5; --c-mint:#6FD0A3; --c-sky:#7DB7F0; --c-peach:#FFAE70;
  --pace-fast:#A99BFF; --pace-mid:#5FD6BB; --pace-slow:#FFC08A;
  --map-land:#191822; --map-park:#1B2E29; --map-water:#1B2A40; --map-road:#292836; --map-label:#9F9BB6;
  --shadow:none; --pop:0 16px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:36px;font-weight:600;line-height:1.1}
h2{font-size:20px;font-weight:600}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink-2)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* tooltips */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:9px;font:600 12px/1.3 var(--font-body);white-space:nowrap;z-index:60;pointer-events:none;letter-spacing:0;text-transform:none}
[data-tip][data-tip-pos="end"]:hover::after,[data-tip][data-tip-pos="end"]:focus-visible::after{left:auto;right:0;transform:none}
[data-tip][data-tip-pos="start"]:hover::after,[data-tip][data-tip-pos="start"]:focus-visible::after{left:0;transform:none}
[data-tip][data-tip-pos="below"]:hover::after{bottom:auto;top:calc(100% + 8px)}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--font-display);font-weight:700;font-size:23px;display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand-mark{width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.navlink{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-md);color:var(--ink-2);font-weight:600;transition:background .15s,color .15s}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.rail .grow{flex:1}
.themeseg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;align-self:flex-start}
.themeseg button{width:36px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--ink-3);transition:background .15s,color .15s}
.themeseg button:hover{color:var(--ink)}
.themeseg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);width:100%;text-align:left;margin-top:8px;transition:background .15s}
.who:hover{background:var(--surface-2)}
.who small{display:block;color:var(--ink-3);font-size:12px;line-height:1.2}
.who b{font-weight:600;line-height:1.2;display:block}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--font-display);color:#1E1B2E;flex:none}
.avatar.sm{width:26px;height:26px;font-size:12px}
.topbar{display:none}
main{padding:28px 32px 56px;min-width:0;max-width:1280px;width:100%}
.view{display:none;flex-direction:column;gap:20px}
.view.on{display:flex}
@media (prefers-reduced-motion:no-preference){.view.on{animation:rise .25s ease}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}

/* building blocks */
.card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 22px 0}
.card-b{padding:16px 22px 22px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;color:var(--ink-2);font-size:13.5px;font-weight:600;min-height:32px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.card .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow);transition:background .15s,color .15s,transform .15s}
.iconbtn:hover{background:var(--accent-soft);color:var(--accent);transform:translateY(-1px)}
.iconbtn.flat{background:var(--surface-2);box-shadow:none}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:600;background:var(--surface-2);min-height:42px;transition:background .15s,transform .15s}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{transform:translateY(-1px);background:var(--accent)}
.btn.danger{background:var(--p-rose);color:var(--i-rose)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--p-butter);color:var(--i-butter)}
.tag.lav{background:var(--p-lav);color:var(--i-lav)}.tag.mint{background:var(--p-mint);color:var(--i-mint)}.tag.peach{background:var(--p-peach);color:var(--i-peach)}.tag.sky{background:var(--p-sky);color:var(--i-sky)}.tag.rose{background:var(--p-rose);color:var(--i-rose)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{border-radius:var(--r-lg);padding:16px 18px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tile .chip{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2)}
.tile .v{font:600 32px/1.1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font:600 14px var(--font-body);color:var(--ink-2);margin-left:4px}
.tile .s{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.t-lav{background:var(--p-lav);box-shadow:none}.tile.t-lav .chip{background:var(--surface);color:var(--i-lav)}
.tile.t-sky{background:var(--p-sky);box-shadow:none}.tile.t-sky .chip{background:var(--surface);color:var(--i-sky)}
.tile.t-mint{background:var(--p-mint);box-shadow:none}.tile.t-mint .chip{background:var(--surface);color:var(--i-mint)}
.tile.t-rose{background:var(--p-rose);box-shadow:none}.tile.t-rose .chip{background:var(--surface);color:var(--i-rose)}
.tile.t-peach{background:var(--p-peach);box-shadow:none}.tile.t-peach .chip{background:var(--surface);color:var(--i-peach)}

/* list */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{padding:7px 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink-2);box-shadow:var(--shadow);transition:background .15s,color .15s}
.fchip:hover{color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.month{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.month h2{font-size:17px;text-transform:capitalize}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.act{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:12px;transition:transform .18s,box-shadow .18s}
.act:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(70,58,140,.13)}
.act .thumb{border-radius:20px;aspect-ratio:16/8;position:relative;overflow:hidden}
.act .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.act .thumb path{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .2s}
.act:hover .thumb path{stroke-width:12}
.act .thumb .km{position:absolute;left:14px;bottom:10px;font:600 26px/1 var(--font-display);font-variant-numeric:tabular-nums}
.act .thumb .km small{font:600 13px var(--font-body);margin-left:3px}
.act .thumb .cp{position:absolute;right:10px;top:10px;background:var(--surface);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600;display:flex;gap:5px;align-items:center}
.act .body{padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.act h3{font-size:18px;font-weight:600;line-height:1.2}
.act .mini{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px}
.act .mini span{display:inline-flex;align-items:center;gap:5px}
.act .mini b{font:600 15.5px var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.emptybox{background:var(--surface);border-radius:var(--r-xl);padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:var(--shadow)}
.emptybox .big{width:64px;height:64px;border-radius:22px;background:var(--p-lav);color:var(--i-lav);display:grid;place-items:center}

/* detail */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:14px;padding:6px 12px 6px 8px;border-radius:999px;margin-left:-8px;transition:background .15s}
.back:hover{background:var(--surface-2);color:var(--ink)}
.meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--ink-2);margin-top:8px}
.meta>span{display:inline-flex;align-items:center;gap:6px}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--pop);padding:8px;min-width:230px;display:none;z-index:40}
.pop.open{display:block}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;font-weight:600;text-align:left}
.pop button:hover{background:var(--surface-2)}
.pop button.dng{color:var(--i-rose)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.mapcard{position:relative;overflow:hidden}
#map{display:block;width:100%;height:auto;aspect-ratio:800/470;touch-action:pan-y;background:var(--map-land)}
.float{position:absolute;background:var(--surface);border-radius:999px;box-shadow:var(--pop);padding:4px}
.float.tl{left:14px;top:14px}
.float.tr{right:14px;top:14px;padding:0;background:none;box-shadow:none}
.legend{position:absolute;left:14px;bottom:14px;background:var(--surface);border-radius:16px;padding:10px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2);box-shadow:var(--pop);max-width:calc(100% - 28px)}
.legend .ramp{height:8px;width:170px;max-width:100%;border-radius:4px;margin:5px 0}
.legend .ends{display:flex;justify-content:space-between;gap:12px}
.legend .zs{display:flex;gap:12px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.tip{position:absolute;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;font-size:12.5px;min-width:150px;display:none;box-shadow:var(--pop)}
.tip.on{display:block}
.tip h4{margin:0 0 6px;font:600 15px var(--font-display)}
.tip div{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip div b{font:600 14px var(--font-display);font-variant-numeric:tabular-nums}
.chartwrap{position:relative}
#chart{display:block;width:100%;height:270px;touch-action:pan-y;cursor:crosshair}
#chart text{font:600 11.5px var(--font-body);fill:var(--ink-3);font-variant-numeric:tabular-nums}
.zbar{display:flex;gap:4px;height:40px}
.zbar span{border-radius:10px;min-width:6px;transition:transform .15s,flex-grow .3s}
.zbar span:hover{transform:scaleY(1.12)}
.zrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 8px;border-radius:12px;transition:background .15s}
.zrow:hover{background:var(--surface-2)}
.zrow .zn{font:600 15px var(--font-display);display:flex;align-items:center}
.zrow .zr{font-size:12.5px;color:var(--ink-2)}
.zrow b{font:600 16px var(--font-display);font-variant-numeric:tabular-nums}
.zrow .pc{font-size:12.5px;color:var(--ink-2);min-width:36px;text-align:right}
.effort{display:flex;align-items:center;gap:14px;background:var(--p-peach);border-radius:var(--r-lg);padding:14px 16px;margin-top:12px}
.effort .ring{width:48px;height:48px;border-radius:16px;background:var(--surface);color:var(--i-peach);display:grid;place-items:center}
.effort .v{font:600 30px/1 var(--font-display)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--p-sky);color:var(--ink);border-radius:var(--r-lg);padding:12px 16px;font-size:14px}
.note .ic{color:var(--i-sky);margin-top:2px}
.journal p{margin:0 0 14px;max-width:60ch}
.rpe{display:flex;gap:4px;margin:6px 0 4px}
.rpe i,.rpe button{flex:1;height:26px;border-radius:8px;background:var(--surface-2);max-width:30px;transition:transform .12s,background .12s}
.rpe .on{background:var(--accent)}
.rpe button:hover{transform:scaleY(1.15)}
textarea,input[type=text],input[type=number]{width:100%;background:var(--surface-2);border:0;border-radius:var(--r-md);padding:10px 14px}
textarea{min-height:110px;resize:vertical}
.tablebox{overflow-x:auto;margin:0 -8px}
table{border-collapse:separate;border-spacing:0 2px;width:100%;min-width:660px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
th{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
td{font:500 16px var(--font-display);font-variant-numeric:tabular-nums;transition:background .12s}
td:first-child{border-radius:12px 0 0 12px;text-align:left}td:last-child{border-radius:0 12px 12px 0}
th:first-child{text-align:left}
td.name{font:600 14.5px var(--font-body)}
tbody tr:hover td,tbody tr.on td{background:var(--surface-2)}
td.bar{width:32%;min-width:150px}
.pb{display:flex;align-items:center;gap:8px}
.pb .t{flex:1;height:12px;border-radius:6px;background:var(--surface-2)}
tbody tr:hover .pb .t,tbody tr.on .pb .t{background:var(--surface-3)}
.pb .t span{display:block;height:100%;border-radius:6px;background:var(--pace-fast)}
.best{font:700 11px var(--font-body);color:var(--i-lav);background:var(--p-lav);padding:2px 8px;border-radius:999px}

/* import */
.igrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.drop{border-radius:var(--r-xl);background:var(--p-lav);padding:44px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;transition:transform .2s,background .2s}
.drop.over{transform:scale(1.01);background:var(--p-mint)}
.drop .big{width:76px;height:76px;border-radius:26px;background:var(--surface);color:var(--i-lav);display:grid;place-items:center}
.drop h2{font-size:23px}
.frow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);transition:background .15s}
.frow:hover{background:var(--surface-2)}
.frow .st{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.frow .st.ok{background:var(--p-mint);color:var(--i-mint)}.frow .st.dup{background:var(--p-butter);color:var(--i-butter)}.frow .st.ko{background:var(--p-rose);color:var(--i-rose)}
.frow .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fs{font-size:13px;color:var(--ink-2)}
.frow .grow{flex:1;min-width:0}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.prog span{display:block;height:100%;width:40%;border-radius:3px;background:var(--accent);animation:slide 1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.facts{display:flex;flex-direction:column;gap:14px}
.fact{display:flex;gap:12px;align-items:flex-start}
.fact .chip{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}

/* settings */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;transition:transform .15s}
.swatches button:hover{transform:scale(1.12)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.hrbig{font:600 44px/1 var(--font-display);font-variant-numeric:tabular-nums}
.zprev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;margin-top:8px}
.zprev .b{height:14px;border-radius:7px}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.themes button{border-radius:var(--r-lg);padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;align-items:stretch;font-weight:600;transition:transform .15s}
.themes button:hover{transform:translateY(-2px)}
.themes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.themes .pv{height:58px;border-radius:12px;display:flex;align-items:flex-end;gap:5px;padding:9px}
.themes .pv i{flex:1;border-radius:4px}
.prow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-md)}
.prow:hover{background:var(--surface-2)}
.prow .grow{flex:1;min-width:0}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(20,16,40,.45);display:none;place-items:center;z-index:80;padding:16px}
#modal.on{display:grid}
.sheet{background:var(--surface);border-radius:var(--r-xl);padding:24px;width:min(440px,100%);box-shadow:var(--pop);display:flex;flex-direction:column;gap:16px}
.pick{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-md);width:100%;text-align:left;font-weight:600}
.pick:hover{background:var(--surface-2)}
.pick[aria-pressed="true"]{background:var(--accent-soft)}
.switch{display:flex;align-items:center;gap:12px;font-weight:600;width:100%;text-align:left}
.switch .tr{width:44px;height:26px;border-radius:13px;background:var(--surface-3);position:relative;flex:none;transition:background .15s}
.switch .tr::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-pressed="true"] .tr{background:var(--accent)}
.switch[aria-pressed="true"] .tr::after{transform:translateX(18px)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{color:var(--ink-3);font-size:13px;max-width:72ch;margin-top:8px}

@media (max-width:1180px){.dgrid,.igrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surface);box-shadow:0 -8px 30px rgba(40,30,90,.10);z-index:50;border-radius:22px 22px 0 0}
  .rail .brand,.rail .grow,.rail .themeseg,.rail .who{display:none}
  .navlink{flex-direction:column;gap:3px;font-size:11.5px;padding:8px 16px}
  .navlink[aria-current="page"]{box-shadow:none;background:var(--accent-soft)}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
  .topbar .brand{padding:0;flex:1;font-size:20px}
  .topbar .who{width:auto;margin:0;padding:4px}
  .topbar .who span{display:none}
  main{padding:16px 16px 110px}
  h1{font-size:28px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile .v{font-size:26px}
  .sgrid{grid-template-columns:minmax(0,1fr)}
  #map{aspect-ratio:4/3.4}
  #chart{height:230px}
  .card-h{padding:16px 16px 0}.card-b{padding:14px 16px 18px}
  #toast{bottom:96px}
}
@media (max-width:560px){.seg.compact button .lb{display:none}.seg.compact button[aria-pressed="true"] .lb{display:inline}.seg.compact button{padding:6px 12px}}
@media (max-width:420px){.acts{grid-template-columns:minmax(0,1fr)}.themes{gap:8px}}

const ROUTES = { activites: renderList, activite: renderDetail, importer: renderImport, reglages: renderSettings };
function route() {
  let r = S.route; if (!ROUTES[r]) r = S.route = "activites";
  S.cursor = null; S.sel = null; S.editing = false;
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + r));
  document.querySelectorAll("[data-nav]").forEach(a => { if (a.dataset.nav === (r === "activite" ? "activites" : r)) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  ROUTES[r](); chrome();
  return r;
}
function go(r) { S.route = r; if (/^https?:$/.test(location.protocol) && location.hash !== "#" + r) { location.hash = r; return; } route(); window.scrollTo(0, 0); }
const hostTheme = root.getAttribute("data-theme");
function setTheme(m, save) {
  S.theme = m;
  if (m === "system") { if (hostTheme) root.setAttribute("data-theme", hostTheme); else root.removeAttribute("data-theme"); } else root.setAttribute("data-theme", m);
  if (save) { try { localStorage.setItem("running-proto-theme", m); } catch (e) {} }
  chrome(); if ($("#v-activite").classList.contains("on")) renderMap();
}
function profileSheet() {
  modal(`<h2>Changer de profil</h2><div>${PROFILES.map(p => `<button class="pick" type="button" data-act="setprofile" data-v="${p.id}" aria-pressed="${p.id === S.profile}">${avatar(p)}<span style="flex:1">${esc(p.name)}<br><small class="muted" style="font-weight:500">${ACTS.filter(a => a.profile === p.id).length} sortie(s)</small></span>${p.id === S.profile ? ic("check") : ""}</button>`).join("")}</div>
    <div class="row" style="justify-content:space-between"><button class="btn" type="button" data-act="addprofile">${ic("plus")}Nouveau profil</button><button class="btn" type="button" data-act="close">Fermer</button></div>`);
}
function targetSheet(kind) {
  const others = PROFILES.filter(p => p.id !== A.profile); S.target = others[0].id; S.keepHR = false;
  const draw = () => modal(`<h2>${kind === "copy" ? "Copier vers un profil" : "Déplacer vers un profil"}</h2>
    <p class="muted" style="margin:0">${kind === "copy" ? "Pour une sortie faite à deux : l'autre personne obtient sa propre sortie, avec son journal." : "La sortie quitte ce profil. Ses zones sont recalculées avec la FC max du nouveau profil."}</p>
    <div>${others.map(p => `<button class="pick" type="button" data-act="target" data-v="${p.id}" aria-pressed="${S.target === p.id}">${avatar(p)}<span style="flex:1">${esc(p.name)}</span>${S.target === p.id ? ic("check") : ""}</button>`).join("")}</div>
    ${kind === "copy" && !A.noHR ? `<button class="switch" type="button" data-act="keephr" aria-pressed="${S.keepHR}"><span class="tr"></span><span>Conserver la fréquence cardiaque<br><small class="muted" style="font-weight:500">Désactivé par défaut : c'est la FC de la personne qui portait la montre.</small></span></button>` : ""}
    <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="${kind === "copy" ? "docopy" : "domove"}">${kind === "copy" ? "Copier" : "Déplacer"}</button></div>`);
  S.redraw = draw; draw();
}
const ACTIONS = {
  theme: v => setTheme(v, true),
  profiles: profileSheet, close: closeModal,
  setprofile: v => { S.profile = v; S.tag = null; closeModal(); if (S.route === "activite") go("activites"); else route(); toast("Profil actif : " + prof().name); },
  addprofile: () => modal(`<h2>Nouveau profil</h2><div class="field" style="margin:0"><label for="npname">Prénom</label><input id="npname" type="text" maxlength="24" placeholder="Par exemple : Sam"></div><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="createprofile">Créer</button></div>`),
  createprofile: () => { const n = $("#npname").value.trim(); if (!n) { $("#npname").focus(); return; } if (PROFILES.some(p => p.name.toLowerCase() === n.toLowerCase())) { toast("Ce prénom est déjà utilisé"); return; } const id = "p" + Date.now(); PROFILES.push({ id, name: n, color: SW[PROFILES.length % SW.length], hrmax: 185, rest: 60 }); S.profile = id; closeModal(); route(); toast("Profil créé : " + n); },
  delprofile: v => { const p = prof(v), n = ACTS.filter(a => a.profile === v).length; modal(`<h2>Supprimer le profil de ${esc(p.name)} ?</h2><p class="muted" style="margin:0">${n ? n + " sortie(s) seront définitivement supprimées avec ce profil." : "Ce profil ne contient aucune sortie."} Les copies déjà faites vers d'autres profils sont conservées.</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn danger" type="button" data-act="dodelprofile" data-v="${v}">${ic("trash")}Supprimer</button></div>`); },
  dodelprofile: v => { PROFILES = PROFILES.filter(p => p.id !== v); ACTS = ACTS.filter(a => a.profile !== v); if (S.profile === v) S.profile = PROFILES[0].id; closeModal(); route(); toast("Profil supprimé"); },
  color: v => { prof().color = v; route(); },
  units: v => { S.units = v; renderSettings(); toast("Les miles seront appliqués partout dans l'application"); },
  basemap: () => { S.basemap = !S.basemap; route(); },
  tag: v => { S.tag = v || null; if (!v) S.period = "all"; renderList(); },
  period: v => { S.period = v; renderList(); },
  open: v => { S.id = v; },
  mode: v => { S.mode = v; renderDetail(); },
  series: v => { S.series = v; renderDetail(); },
  showAlt: () => { S.showAlt = !S.showAlt; renderDetail(); },
  showKm: () => { S.showKm = !S.showKm; renderDetail(); },
  split: v => { S.split = v; S.sel = null; renderDetail(); },
  more: () => $("#more").classList.toggle("open"),
  export: () => toast("Export GPX : inactif dans ce prototype"),
  original: () => toast("Téléchargement du fichier d'origine : inactif dans ce prototype"),
  copy: () => targetSheet("copy"), move: () => targetSheet("move"),
  target: v => { S.target = v; S.redraw(); }, keephr: () => { S.keepHR = !S.keepHR; S.redraw(); },
  docopy: () => { const root0 = A.from || A.id; if (ACTS.some(a => a.profile === S.target && (a.from === root0 || a.id === root0))) { closeModal(); toast("Cette sortie est déjà dans le profil de " + prof(S.target).name); return; } ACTS.push({ ...A, id: "x" + Date.now(), profile: S.target, from: root0, noHR: A.noHR || !S.keepHR, tags: [...A.tags], desc: "", rpe: 0 }); closeModal(); toast("Ajoutée au profil de " + prof(S.target).name); },
  domove: () => { A.profile = S.target; closeModal(); toast("Déplacée vers le profil de " + prof(S.target).name); go("activites"); },
  delete: () => modal(`<h2>Supprimer cette sortie ?</h2><p class="muted" style="margin:0">« ${esc(A.title)} », son journal et son fichier d'origine seront définitivement supprimés.</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn danger" type="button" data-act="dodelete">${ic("trash")}Supprimer</button></div>`),
  dodelete: () => { ACTS = ACTS.filter(a => a.id !== A.id); closeModal(); toast("Sortie supprimée"); go("activites"); },
  jedit: () => { S.editing = true; S.draftRpe = A.rpe; S.draftTags = [...A.tags]; renderJournal(); },
  jcancel: () => { S.editing = false; renderJournal(); },
  rpe: v => { A.desc = $("#jdesc").value; A.title = $("#jtitle").value.trim() || A.title; S.draftRpe = S.draftRpe === +v ? 0 : +v; renderJournal(); },
  jtag: v => { A.desc = $("#jdesc").value; A.title = $("#jtitle").value.trim() || A.title; S.draftTags = S.draftTags.includes(v) ? S.draftTags.filter(t => t !== v) : [...S.draftTags, v]; renderJournal(); },
  jsave: () => { A.title = $("#jtitle").value.trim() || A.title; A.desc = $("#jdesc").value.trim(); A.rpe = S.draftRpe; A.tags = S.draftTags; S.editing = false; renderDetail(); toast("Journal enregistré"); },
  demo: () => startImport(DEMO.map(d => ({ ...d })))
};
document.addEventListener("click", e => {
  const more = $("#more"); if (more && !e.target.closest('[data-act="more"]')) more.classList.remove("open");
  if (e.target.id === "modal") { closeModal(); return; }
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled) { const fn = ACTIONS[el.dataset.act]; if (fn) fn(el.dataset.v, el, e); }
  const link = e.target.closest('a[href^="#"]'); if (link) { e.preventDefault(); go(link.getAttribute("href").slice(1)); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
window.addEventListener("hashchange", () => { S.route = location.hash.replace("#", ""); route(); window.scrollTo(0, 0); });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if ($("#v-activite").classList.contains("on")) renderMap(); });
let saved = null; try { saved = localStorage.getItem("running-proto-theme"); } catch (e) {}
S.theme = saved === "light" || saved === "dark" ? saved : "system";
if (S.theme !== "system") root.setAttribute("data-theme", S.theme);
S.route = location.hash.replace("#", "") || "activites";
route();
})();
</script>
