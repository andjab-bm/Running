<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Running — prototype progression et planification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same tokens and building blocks as prototype/activity-detail.html (approved 2026-11-15).
   New here: heatmap, bar and line charts, session outline, step editor, phone delivery pill. */
:root{
  --bg:#F4F3F9; --surface:#FFFFFF; --surface-2:#EFEEF7; --surface-3:#E6E4F2;
  --ink:#1E1B2E; --ink-2:#54506B; --ink-3:#6A6682;
  --accent:#6252DE; --accent-soft:#E7E3FC; --on-accent:#FFFFFF;
  --p-lav:#E7E3FC; --p-mint:#D6F3E5; --p-peach:#FFE4D3; --p-sky:#D8EAFB; --p-butter:#FBF1C9; --p-rose:#FCDFE7;
  --i-lav:#5446C9; --i-mint:#1B7550; --i-peach:#A94F1C; --i-sky:#1D639F; --i-butter:#7D6000; --i-rose:#A82C5A;
  --c-rose:#E46F90; --c-mint:#35AF80; --c-sky:#4A97D8; --c-peach:#EE8A4C;
  --z1:#A3ABC8; --z2:#7DB7F0; --z3:#6FD0A3; --z4:#FFAE70; --z5:#F58AA5;
  --pace-fast:#6252DE; --pace-mid:#4FC3A8; --pace-slow:#FFB26B;
  --map-land:#ECEBF4; --map-park:#D9F0E2; --map-water:#D3E6FA; --map-road:#FFFFFF; --map-label:#6A6682;
  --shadow:0 12px 32px rgba(70,58,140,.07);
  --pop:0 16px 48px rgba(40,30,90,.18);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xl:28px; --r-lg:20px; --r-md:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121118; --surface:#1B1A25; --surface-2:#252431; --surface-3:#302F3F;
    --ink:#F2F0FA; --ink-2:#BDB9D1; --ink-3:#9F9BB6;
    --accent:#A99BFF; --accent-soft:#2D2A4B; --on-accent:#15122B;
    --p-lav:#2C2949; --p-mint:#1C372E; --p-peach:#3F2D20; --p-sky:#1C2F44; --p-butter:#38321A; --p-rose:#40222E;
    --i-lav:#BDB2FF; --i-mint:#8FE0BB; --i-peach:#FFC39C; --i-sky:#9CCBF7; --i-butter:#EFD877; --i-rose:#F7AFC3;
    --c-rose:#F58AA5; --c-mint:#6FD0A3; --c-sky:#7DB7F0; --c-peach:#FFAE70;
    --pace-fast:#A99BFF; --pace-mid:#5FD6BB; --pace-slow:#FFC08A;
    --map-land:#191822; --map-park:#1B2E29; --map-water:#1B2A40; --map-road:#292836; --map-label:#9F9BB6;
    --shadow:none; --pop:0 16px 48px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121118; --surface:#1B1A25; --surface-2:#252431; --surface-3:#302F3F;
  --ink:#F2F0FA; --ink-2:#BDB9D1; --ink-3:#9F9BB6;
  --accent:#A99BFF; --accent-soft:#2D2A4B; --on-accent:#15122B;
  --p-lav:#2C2949; --p-mint:#1C372E; --p-peach:#3F2D20; --p-sky:#1C2F44; --p-butter:#38321A; --p-rose:#40222E;
  --i-lav:#BDB2FF; --i-mint:#8FE0BB; --i-peach:#FFC39C; --i-sky:#9CCBF7; --i-butter:#EFD877; --i-rose:#F7AFC3;
  --c-rose:#F58AA5; --c-mint:#6FD0A3; --c-sky:#7DB7F0; --c-peach:#FFAE70;
  --pace-fast:#A99BFF; --pace-mid:#5FD6BB; --pace-slow:#FFC08A;
  --map-land:#191822; --map-park:#1B2E29; --map-water:#1B2A40; --map-road:#292836; --map-label:#9F9BB6;
  --shadow:none; --pop:0 16px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:36px;font-weight:600;line-height:1.1}
h2{font-size:20px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:9px;font:600 12px/1.3 var(--font-body);white-space:nowrap;z-index:60;pointer-events:none;letter-spacing:0;text-transform:none}
[data-tip][data-tip-pos="end"]:hover::after,[data-tip][data-tip-pos="end"]:focus-visible::after{left:auto;right:0;transform:none}
[data-tip][data-tip-pos="start"]:hover::after,[data-tip][data-tip-pos="start"]:focus-visible::after{left:0;transform:none}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--font-display);font-weight:700;font-size:23px;display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand-mark{width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.navlink{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-md);color:var(--ink-2);font-weight:600;transition:background .15s,color .15s}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.rail .grow{flex:1}
.themeseg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;align-self:flex-start}
.themeseg button{width:36px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--ink-3);transition:background .15s,color .15s}
.themeseg button:hover{color:var(--ink)}
.themeseg button[aria-pressed="true"]{background:var(--surface);color:var(--i-lav);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);width:100%;text-align:left;margin-top:8px;transition:background .15s}
.who:hover{background:var(--surface-2)}
#modal{position:fixed;inset:0;background:rgba(20,16,40,.45);display:none;place-items:center;z-index:80;padding:16px}
#modal.on{display:grid}
.sheet{background:var(--surface);border-radius:var(--r-xl);padding:24px;width:min(440px,100%);box-shadow:var(--pop);display:flex;flex-direction:column;gap:12px}
.pick{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-md);width:100%;text-align:left;font-weight:600}
.pick:hover{background:var(--surface-2)}
.pick[aria-pressed="true"]{background:var(--accent-soft)}
.pick small{display:block;font-weight:500;color:var(--ink-2);font-size:13px}
.who small{display:block;color:var(--ink-3);font-size:12px;line-height:1.2}
.who b{font-weight:600;line-height:1.2;display:block}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--font-display);color:#1E1B2E;flex:none;background:#B9AFFF}
.avatar.xs{width:22px;height:22px;font-size:11px}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink-2);box-shadow:var(--shadow);min-height:36px;transition:background .15s,color .15s}
.fchip:hover{color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.owners{position:absolute;left:10px;top:10px;background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;color:var(--ink)}
.owners .avatar+.avatar{margin-left:-11px;box-shadow:0 0 0 2px var(--surface)}
.topbar{display:none}
main{padding:28px 32px 56px;min-width:0;max-width:1280px;width:100%;display:flex;flex-direction:column;gap:20px}
@media (prefers-reduced-motion:no-preference){main>*{animation:rise .25s ease}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}

/* building blocks */
.card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 22px 0}
.card-b{padding:16px 22px 22px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 14px;border-radius:999px;color:var(--ink-2);font-size:13.5px;font-weight:600;min-height:32px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.card .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.tabs{display:inline-flex;background:var(--surface);border-radius:999px;padding:5px;gap:4px;box-shadow:var(--shadow);align-self:flex-start;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:9px 18px;border-radius:999px;color:var(--ink-2);font-weight:600;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{background:var(--surface-2);color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow);transition:background .15s,color .15s,transform .15s}
.iconbtn:hover{background:var(--accent-soft);color:var(--i-lav);transform:translateY(-1px)}
.iconbtn.flat{background:var(--surface-2);box-shadow:none}
.iconbtn.sm{width:34px;height:34px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:600;background:var(--surface-2);min-height:42px;transition:background .15s,transform .15s}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{transform:translateY(-1px);background:var(--accent)}
.btn.danger{background:var(--p-rose);color:var(--i-rose)}
.btn.sm{min-height:34px;padding:6px 14px;font-size:13.5px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--p-butter);color:var(--i-butter);white-space:nowrap}
.tag.lav{background:var(--p-lav);color:var(--i-lav)}.tag.mint{background:var(--p-mint);color:var(--i-mint)}.tag.peach{background:var(--p-peach);color:var(--i-peach)}.tag.sky{background:var(--p-sky);color:var(--i-sky)}.tag.rose{background:var(--p-rose);color:var(--i-rose)}.tag.plain{background:var(--surface-2);color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:14px;padding:6px 12px 6px 8px;border-radius:999px;margin-left:-8px;align-self:flex-start}
.back:hover{background:var(--surface-2);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tile .chip{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface)}
.tile .v{font:600 32px/1.1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font:600 14px var(--font-body);color:var(--ink-2);margin-left:4px}
.tile .s{font-size:12.5px;color:var(--ink-2)}
.t-lav{background:var(--p-lav)}.t-lav .chip{color:var(--i-lav)}
.t-sky{background:var(--p-sky)}.t-sky .chip{color:var(--i-sky)}
.t-mint{background:var(--p-mint)}.t-mint .chip{color:var(--i-mint)}
.t-rose{background:var(--p-rose)}.t-rose .chip{color:var(--i-rose)}
.t-peach{background:var(--p-peach)}.t-peach .chip{color:var(--i-peach)}
.t-butter{background:var(--p-butter)}.t-butter .chip{color:var(--i-butter)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--p-sky);border-radius:var(--r-lg);padding:12px 16px;font-size:14px}
.note .ic{color:var(--i-sky);margin-top:2px}
.note.butter{background:var(--p-butter)}.note.butter .ic{color:var(--i-butter)}
.emptybox{background:var(--surface);border-radius:var(--r-xl);padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:var(--shadow)}
.emptybox .big{width:64px;height:64px;border-radius:22px;background:var(--p-lav);color:var(--i-lav);display:grid;place-items:center}
.emptybox p{max-width:52ch;color:var(--ink-2)}
.tablebox{overflow-x:auto;margin:0 -8px}
table{border-collapse:separate;border-spacing:0 2px;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
th{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
td{font:500 16px var(--font-display);font-variant-numeric:tabular-nums;transition:background .12s}
td:first-child{border-radius:12px 0 0 12px;text-align:left}td:last-child{border-radius:0 12px 12px 0}
th:first-child{text-align:left}
td.name{font:600 14.5px var(--font-body)}
tbody tr:hover td,tbody tr.on td{background:var(--surface-2)}
tbody tr[data-act]{cursor:pointer}
.best{font:700 11px var(--font-body);color:var(--i-lav);background:var(--p-lav);padding:2px 8px;border-radius:999px}
.medal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font:700 12px var(--font-display);background:var(--surface-2);color:var(--ink-2)}
.medal.m1{background:var(--p-butter);color:var(--i-butter)}.medal.m2{background:var(--surface-3);color:var(--ink)}.medal.m3{background:var(--p-peach);color:var(--i-peach)}
textarea,input[type=text],input[type=number],select{background:var(--surface-2);border:0;border-radius:var(--r-md);padding:9px 12px;min-height:40px}
input[type=text]{width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.demo .seg button{min-height:28px;padding:4px 11px;font-size:12.5px}

/* heatmap */
.heatwrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:4px;width:max-content}
.heat button{width:14px;height:14px;border-radius:4px;background:var(--surface-2);transition:transform .12s}
.heat button:hover,.heat button.on{transform:scale(1.35);outline:2px solid var(--ink);outline-offset:1px}
.heat .out{visibility:hidden}
.heat .l1{background:color-mix(in srgb,var(--hm) 28%,var(--surface-2))}
.heat .l2{background:color-mix(in srgb,var(--hm) 52%,var(--surface-2))}
.heat .l3{background:color-mix(in srgb,var(--hm) 78%,var(--surface-2))}
.heat .l4{background:var(--hm)}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:18px;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px;width:max-content}
.months span{white-space:nowrap;overflow:visible}
.hlegend{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3)}
.hlegend i{width:13px;height:13px;border-radius:4px;display:block}
.daybox{background:var(--surface-2);border-radius:var(--r-lg);padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;min-height:54px;margin-top:14px}

/* charts */
.bars{display:flex;align-items:flex-end;gap:6px;height:200px;padding-top:22px}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;position:relative}
.bars .b i{display:block;width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:var(--accent);min-height:3px;transition:filter .15s,transform .15s;transform-origin:bottom}
.bars .b:hover i{transform:scaleY(1.04);filter:brightness(1.08)}
.bars .b.cur i{background:repeating-linear-gradient(135deg,var(--accent) 0 5px,color-mix(in srgb,var(--accent) 55%,var(--surface)) 5px 10px)}
.bars .b.zero i{background:var(--surface-3)}
.bars .b span{font-size:11px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.bars .b em{font:600 12px var(--font-display);font-style:normal;position:absolute;bottom:calc(var(--h) + 26px);opacity:0;transition:opacity .12s;background:var(--ink);color:var(--bg);padding:2px 7px;border-radius:7px;white-space:nowrap;z-index:5}
.bars .b:hover em{opacity:1}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{font:600 11.5px var(--font-body);fill:var(--ink-3);font-variant-numeric:tabular-nums}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.lg i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mini3>div{background:var(--surface-2);border-radius:var(--r-lg);padding:14px 16px 10px}

/* records */
.recs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rec{border-radius:var(--r-lg);padding:16px 18px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;text-align:left;transition:transform .15s,background .15s}
.rec:hover{transform:translateY(-2px)}
.rec[aria-pressed="true"]{background:var(--p-lav);box-shadow:none}
.rec .d{font-size:13px;font-weight:700;color:var(--ink-2)}
.rec .t{font:600 34px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.rec .o{font-size:12.5px;color:var(--ink-2)}
.rec.none .t{color:var(--ink-3);font-size:22px;line-height:1.6}
.pred{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:12px;border-radius:var(--r-md)}
.pred:hover{background:var(--surface-2)}
.pred .t{font:600 26px var(--font-display);font-variant-numeric:tabular-nums}
.pred .d{font:600 16px var(--font-display);min-width:74px}

/* load */
.status{border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.status .v{font:600 28px/1.15 var(--font-display)}
.gaugebar{height:12px;border-radius:6px;display:flex;gap:3px;margin-top:8px}
.gaugebar i{flex:1;border-radius:6px;background:var(--surface);opacity:.55}
.gaugebar i.on{opacity:1;background:var(--ink)}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--c-mint) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:88px;height:88px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font:600 24px/1 var(--font-display)}
.ring small{display:block;font:600 11.5px var(--font-body);color:var(--ink-2);margin-top:3px}
details{background:var(--surface-2);border-radius:var(--r-lg);padding:14px 18px}
details summary{font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details[open] summary .ic{transform:rotate(180deg)}
details ul{margin:10px 0 0;padding-left:18px;color:var(--ink-2);max-width:70ch}
details li{margin:4px 0}

/* library cards */
.libs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.lib{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:transform .18s,box-shadow .18s;min-width:0}
.lib:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(70,58,140,.13)}
.lib .thumb{border-radius:20px;aspect-ratio:16/8;position:relative;overflow:hidden;background:var(--p-sky)}
.lib .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.lib .mini{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px}
.lib .mini b{font:600 15.5px var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.outline{display:flex;align-items:flex-end;gap:3px;height:54px;background:var(--surface-2);border-radius:14px;padding:8px}
.outline i{display:block;border-radius:5px;min-width:4px;transition:transform .12s;transform-origin:bottom}
.outline i:hover{transform:scaleY(1.1)}
.k-warmup{background:var(--c-mint);height:45%}.k-effort{background:var(--accent);height:100%}.k-recovery{background:var(--c-sky);height:30%}.k-cooldown{background:var(--c-peach);height:40%}
.phone{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);transition:background .15s}
.phone:hover{background:var(--surface-3)}
.phone.wait{background:var(--p-butter);color:var(--i-butter)}
.phone.ok{background:var(--p-mint);color:var(--i-mint)}

/* editor */
.step{display:grid;grid-template-columns:8px minmax(120px,1fr) minmax(0,1.3fr) minmax(0,1.6fr) auto;gap:10px;align-items:center;padding:10px;border-radius:var(--r-md);transition:background .15s}
.step:hover{background:var(--surface-2)}
.step .bar{width:8px;align-self:stretch;border-radius:4px;height:auto}
.step .pair{display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.step select,.step input{min-width:0}
.step input[type=text]{width:74px;text-align:center;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.step .acts{display:flex;gap:2px}
.repeat{background:var(--p-lav);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:4px}
.repeat .step:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.repeat .step select,.repeat .step input{background:var(--surface)}
.repeat .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 8px 6px;font-weight:600}
.stepper{display:inline-flex;align-items:center;background:var(--surface);border-radius:999px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.stepper button:hover{background:var(--surface-2)}
.stepper b{font:600 17px var(--font-display);min-width:34px;text-align:center}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px}
.switch .tr{width:40px;height:24px;border-radius:12px;background:var(--surface-3);position:relative;flex:none;transition:background .15s}
.switch .tr::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-pressed="true"] .tr{background:var(--accent)}
.switch[aria-pressed="true"] .tr::after{transform:translateX(16px)}

/* map stand-in */
.mapbox{position:relative;border-radius:var(--r-xl);overflow:hidden;background:var(--map-land)}
.mapbox svg{display:block;width:100%;height:auto}
.prow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-md);width:100%;text-align:left}
.prow:hover{background:var(--surface-2)}
.prow .grow{flex:1;min-width:0}
.prow .th{width:64px;height:44px;border-radius:12px;background:var(--p-sky);flex:none;overflow:hidden}
.prow .th svg{width:100%;height:100%}
.target{display:inline-flex;align-items:center;gap:6px}
.target i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hit i{background:var(--c-mint)}.miss i{background:var(--c-peach)}.undone{color:var(--ink-3)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{color:var(--ink-3);font-size:13px;max-width:72ch}

@media (max-width:1180px){.dgrid,.grid2{grid-template-columns:minmax(0,1fr)}.recs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:var(--surface);box-shadow:0 -8px 30px rgba(40,30,90,.10);z-index:50;border-radius:22px 22px 0 0}
  .rail .brand,.rail .grow,.rail .themeseg,.rail .who{display:none}
  .navlink{flex-direction:column;gap:3px;font-size:11px;padding:8px 8px;flex:1;min-width:0}
  .navlink[aria-current="page"]{box-shadow:none;background:var(--accent-soft);color:var(--i-lav)}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
  .topbar .brand{padding:0;flex:1;font-size:20px}
  .topbar .who{width:auto;margin:0;padding:4px}
  main{padding:16px 16px 110px}
  h1{font-size:28px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile .v{font-size:26px}
  .card-h{padding:16px 16px 0}.card-b{padding:14px 16px 18px}
  .mini3{grid-template-columns:minmax(0,1fr)}
  .step{grid-template-columns:8px minmax(0,1fr) auto}
  .step .pair{grid-column:2/4}
  .step .acts{grid-row:1;grid-column:3}
  .bars{gap:3px}.bars .b span{font-size:9.5px}
  #toast{bottom:96px}
}
@media (max-width:420px){.recs{grid-template-columns:minmax(0,1fr)}.libs{grid-template-columns:minmax(0,1fr)}.rec .t{font-size:30px}}

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const root = document.documentElement;
const ic = (n, s = 18) => `<svg class="ic" width="${s}" height="${s}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const TODAY = new Date(2026, 10, 16);
const DAY = 864e5;
const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const pad = n => String(n).padStart(2, "0");
const dur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
const pace = s => `${Math.floor(Math.round(s) / 60)}:${pad(Math.round(s) % 60)}`;
const dec = (n, d = 1) => n.toFixed(d).replace(".", ",");
const fdate = d => `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const sdate = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ---------- fictional data ---------- */
// One entry per day that has runs: { d: Date, runs: [{ km, min, load, title }] }
function makeYear(y, density) {
  const out = [];
  const end = y === 2026 ? TODAY : new Date(y, 11, 31);
  for (let d = new Date(y, 0, 1); d <= end; d = new Date(d.getTime() + DAY)) {
    const wd = (d.getDay() + 6) % 7;
    const base = [0.12, 0.62, 0.08, 0.58, 0.1, 0.3, 0.72][wd] * density;
    if (rnd() < base) {
      const long = wd === 6;
      const km = long ? 9 + rnd() * 7 : 4 + rnd() * 5;
      const runs = [{ km, min: km * (5.9 + rnd() * 0.7), load: Math.round(km * (9 + rnd() * 5)), title: long ? "Sortie longue" : wd === 3 ? "Fractionné" : "Footing" }];
      if (rnd() < 0.04) runs.push({ km: 3, min: 19, load: 28, title: "Footing du soir" });
      out.push({ d: new Date(d), runs });
    }
  }
  return out;
}
let YEARS = { 2026: makeYear(2026, 1), 2025: makeYear(2025, 0.7), 2024: [] };
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const dayVal = (e, m) => sum(e.runs, r => m === "dist" ? r.km : m === "time" ? r.min : r.load);

const makeProgress = slow => {  // last 12 months, oldest first; hr is missing in one month
  const a = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(2026, 10 - i, 1);
    a.push({ label: MONTHS[d.getMonth()], pace: 402 + slow - (11 - i) * 3.1 + (rnd() - .5) * 6, long: (8 + (11 - i) * 0.75 + rnd() * 1.5) * (slow ? .6 : 1), hr: i === 7 ? null : 156 - (11 - i) * 0.6 + (rnd() - .5) * 3 });
  }
  return a;
};
let PROGRESS = makeProgress(0);

let RECORDS = [
  { d: "400 m", m: 400, best: [[98, new Date(2026, 9, 8)], [101, new Date(2026, 8, 17)], [104, new Date(2026, 6, 2)]], hist: [[112, new Date(2025, 9, 4)], [106, new Date(2026, 2, 12)], [104, new Date(2026, 6, 2)], [101, new Date(2026, 8, 17)], [98, new Date(2026, 9, 8)]] },
  { d: "1 km", m: 1000, best: [[292, new Date(2026, 9, 8)], [298, new Date(2026, 8, 3)], [305, new Date(2026, 5, 20)]], hist: [[338, new Date(2025, 8, 14)], [321, new Date(2026, 1, 7)], [305, new Date(2026, 5, 20)], [298, new Date(2026, 8, 3)], [292, new Date(2026, 9, 8)]] },
  { d: "5 km", m: 5000, best: [[1660, new Date(2026, 10, 2)], [1695, new Date(2026, 8, 20)], [1742, new Date(2026, 5, 6)]], hist: [[1910, new Date(2025, 9, 18)], [1805, new Date(2026, 2, 28)], [1742, new Date(2026, 5, 6)], [1695, new Date(2026, 8, 20)], [1660, new Date(2026, 10, 2)]] },
  { d: "10 km", m: 10000, best: [[3485, new Date(2026, 9, 25)], [3580, new Date(2026, 7, 9)], [3730, new Date(2026, 3, 12)]], hist: [[3730, new Date(2026, 3, 12)], [3580, new Date(2026, 7, 9)], [3485, new Date(2026, 9, 25)]] },
  { d: "Semi-marathon", m: 21097.5, best: [[7950, new Date(2026, 9, 11)]], hist: [[7950, new Date(2026, 9, 11)]] },
  { d: "Marathon", m: 42195, best: [], hist: [] }
];
const riegel = (t, d1, d2) => t * Math.pow(d2 / d1, 1.06);

// 84 days of load ending today, zero on rest days
const makeLoad = () => {

const STATUS = [

const unfold = items => items.flatMap(it => it.type === "repeat" ? Array.from({ length: it.count }, (_, i) => it.steps.filter((x, j) => !(it.skipLast && i === it.count - 1 && j === it.steps.length - 1 && x.kind === "recovery"))).flat() : [it]);

  return `${head}<div class="libs">${cards}</div><div class="note">${ic("info", 18)}<span>Un parcours peut aussi être créé depuis une de vos courses : bouton « Créer un parcours » sur la page de l'activité.</span></div>`;
}

function stepRow(s, path) {
  return `<div class="step"><i class="bar k-${s.kind}"></i>
    <select data-ed="kind" data-p="${path}" aria-label="Type d'étape">${Object.entries(KIND).map(k => `<option value="${k[0]}" ${s.kind === k[0] ? "selected" : ""}>${k[1]}</option>`).join("")}</select>
    <span class="pair"><select data-ed="endt" data-p="${path}" aria-label="Fin de l'étape"><option value="time" ${s.end.t === "time" ? "selected" : ""}>Durée</option><option value="dist" ${s.end.t === "dist" ? "selected" : ""}>Distance</option><option value="lap" ${s.end.t === "lap" ? "selected" : ""}>Jusqu'à Tour</option></select>${s.end.t === "lap" ? "" : `<input type="text" data-ed="endv" data-p="${path}" value="${s.end.t === "time" ? dur(s.end.v) : s.end.v}" aria-label="${s.end.t === "time" ? "Durée (min:s)" : "Distance en mètres"}"><span class="small muted">${s.end.t === "time" ? "min:s" : "m"}</span>`}</span>
    <span class="pair"><select data-ed="tt" data-p="${path}" aria-label="Cible"><option value="none" ${s.target.t === "none" ? "selected" : ""}>Sans cible</option><option value="pace" ${s.target.t === "pace" ? "selected" : ""}>Allure</option><option value="zone" ${s.target.t === "zone" ? "selected" : ""}>Zone cardio</option></select>${s.target.t === "pace" ? `<input type="text" data-ed="lo" data-p="${path}" value="${pace(s.target.lo)}" aria-label="Allure la plus rapide"><span class="small muted">à</span><input type="text" data-ed="hi" data-p="${path}" value="${pace(s.target.hi)}" aria-label="Allure la plus lente"><span class="small muted">/km</span>` : s.target.t === "zone" ? `<select data-ed="z" data-p="${path}" aria-label="Zone">${[1, 2, 3, 4, 5].map(z => `<option ${s.target.z === z ? "selected" : ""} value="${z}">Z${z} · ${[93, 112, 130, 149, 167][z - 1]}–${[112, 130, 149, 167, 186][z - 1]} bpm</option>`).join("")}</select>` : ""}</span>
    <span class="acts"><button type="button" class="iconbtn flat sm" data-act="mv" data-p="${path}" data-v="-1" data-tip="Monter" aria-label="Monter">${ic("up", 16)}</button><button type="button" class="iconbtn flat sm" data-act="mv" data-p="${path}" data-v="1" data-tip="Descendre" aria-label="Descendre">${ic("chev", 16)}</button><button type="button" class="iconbtn flat sm" data-act="rm" data-p="${path}" data-tip="Retirer" data-tip-pos="end" aria-label="Retirer l'étape">${ic("x", 16)}</button></span></div>`;
}
function vEditor() {
  const w = S.draft, t = totals(w.items.length ? w.items : [st("effort", "time", 0)]);
  const body = w.items.map((it, i) => it.type === "repeat"
    ? `<div class="repeat"><div class="head">${ic("repeat", 17)}Répéter<span class="stepper"><button type="button" data-act="cnt" data-p="${i}" data-v="-1" aria-label="Moins">${ic("minus", 15)}</button><b>${it.count}×</b><button type="button" data-act="cnt" data-p="${i}" data-v="1" aria-label="Plus">${ic("plus", 15)}</button></span><button type="button" class="switch" data-act="skip" data-p="${i}" aria-pressed="${it.skipLast}"><span class="tr"></span>Sans la dernière récupération</button><span style="flex:1"></span><button type="button" class="iconbtn sm" data-act="rm" data-p="${i}" data-tip="Retirer le bloc" data-tip-pos="end" aria-label="Retirer le bloc">${ic("x", 16)}</button></div>${it.steps.map((s, j) => stepRow(s, `${i}.${j}`)).join("")}<div><button type="button" class="btn sm" style="background:var(--surface)" data-act="addstep" data-p="${i}">${ic("plus", 15)}Étape dans le bloc</button></div></div>`
    : stepRow(it, String(i))).join("");
  return `<a href="#" class="back" data-act="canceled">${ic("back", 18)}Séances</a>
  <div class="spread"><h1>${w.id ? "Modifier la séance" : "Nouvelle séance"}</h1><div class="row"><button type="button" class="btn" data-act="canceled">Annuler</button><button type="button" class="btn primary" data-act="savew">${ic("check")}Enregistrer</button></div></div>
  <div class="dgrid"><div class="col">
    <div class="card"><div class="card-b" style="padding-top:22px;display:flex;flex-direction:column;gap:14px"><div class="field"><label for="wname">Nom</label><input type="text" id="wname" value="${w.name}" placeholder="Par exemple : 6 × 400 m"></div><div class="field"><label for="wnote">Note (facultatif)</label><input type="text" id="wnote" value="${w.note || ""}"></div>${w.error ? `<div class="note butter">${ic("info", 18)}<span>${w.error}</span></div>` : ""}</div></div>
    <div class="card"><div class="card-h"><h2>Étapes</h2><div class="row"><button type="button" class="btn sm" data-act="addstep" data-p="">${ic("plus", 15)}Étape</button><button type="button" class="btn sm" data-act="addrep">${ic("repeat", 15)}Bloc répété</button></div></div><div class="card-b" style="display:flex;flex-direction:column;gap:6px">${body || `<p class="muted">Aucune étape. Ajoutez-en une pour pouvoir enregistrer.</p>`}</div></div>
  </div><div class="col">
    <div class="card"><div class="card-h"><h2>Déroulé</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:12px">${w.items.length ? outline(w.items) : ""}<div class="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="tile t-mint"><div class="top">Durée</div><div class="v" style="font-size:22px;white-space:normal">${w.items.length ? t.t : "—"}</div></div><div class="tile t-sky"><div class="top">Distance</div><div class="v" style="font-size:22px;white-space:normal">${w.items.length ? t.d : "—"}</div></div></div><p class="small muted">« Au moins » : la séance contient une étape qui dure jusqu'à l'appui sur Tour. « Inconnue » : rien ne permet de la calculer sans inventer.</p></div></div>
  </div></div>`;

function vRoute(r) {
  const prof = r.ele ? (() => { const w = 640, h = 150, lo = Math.min(...r.ele), hi = Math.max(...r.ele), X = i => i * w / (r.ele.length - 1), Y = v => 14 + (1 - (v - lo) / (hi - lo || 1)) * (h - 40); const d = r.ele.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(""); return `<svg class="chart" id="rprof" viewBox="0 0 ${w} ${h}" style="cursor:crosshair;touch-action:pan-y" role="img" aria-label="Profil d'altitude"><path d="${d}L${w} ${h - 22}L0 ${h - 22}Z" fill="var(--p-sky)"/><path d="${d}" fill="none" stroke="var(--c-sky)" stroke-width="2.6"/><line id="rcur" y1="8" y2="${h - 22}" stroke="var(--ink)" stroke-width="1.5" visibility="hidden"/><text x="0" y="${h - 4}">0 km</text><text x="${w}" y="${h - 4}" text-anchor="end">${dec(r.km)} km</text><text id="rlab" x="0" y="10" style="fill:var(--ink)"></text></svg>`; })() : `<p class="muted">Ce fichier ne contient pas d'altitude : dénivelé indisponible, et l'allure ajustée à la pente ne sera pas proposée sur ce parcours.</p>`;
  return `<a href="#" class="back" data-act="routeback">${ic("back", 18)}Parcours</a>
  <div class="spread"><div><h1>${r.name}</h1><div class="row muted" style="margin-top:8px"><span>${ic("route", 16)} ${dec(r.km)} km</span><span>${ic("mountain", 16)} ${r.gain == null ? "D+ indisponible" : `${r.gain} m D+ · ${r.loss} m D−`}</span>${r.loop ? `<span class="tag sky">Boucle</span>` : ""}</div></div>
  <div class="row">${phonePill(r, "r", r.id)}<button type="button" class="iconbtn" data-act="toast" data-v="Parcours inversé créé : « ${r.name} (inverse) »" data-tip="Créer le parcours inverse" aria-label="Créer le parcours inverse">${ic("swap")}</button><button type="button" class="iconbtn" data-act="toast" data-v="Export .gpx (inerte dans la maquette)" data-tip="Exporter en .gpx" aria-label="Exporter en .gpx">${ic("download")}</button><button type="button" class="iconbtn" data-act="toast" data-v="Copié vers le profil de Camille" data-tip="Copier vers un autre profil" aria-label="Copier vers un autre profil">${ic("copy")}</button><button type="button" class="iconbtn" data-act="toast" data-v="Suppression : les courses faites avec ce parcours ne changent pas" data-tip="Supprimer" data-tip-pos="end" aria-label="Supprimer">${ic("trash")}</button></div></div>
  <div class="dgrid"><div class="col"><div class="mapbox" id="rmap">${mapSvg(r.tr, "rdot")}</div><div class="card"><div class="card-h"><h2>Profil d'altitude</h2><span class="small muted">Survolez : le point suit sur la carte</span></div><div class="card-b">${prof}</div></div></div>
  <div class="col"><div class="card"><div class="card-h"><h2>Courses faites avec ce parcours</h2></div><div class="card-b">${r.runs ? Array.from({ length: Math.min(4, r.runs) }, (_, i) => `<a href="#" class="prow" data-act="openact"><span class="grow"><b>${["Sortie du dimanche", "Canal au lever du jour", "Footing tranquille", "Sortie longue"][i]}</b><br><span class="small muted">${sdate(new Date(2026, 10 - i, 15 - i * 3))} · ${dur(r.km * (352 + i * 9))}</span></span>${ic("chev", 16)}</a>`).join("") : `<p class="muted">Pas encore couru. Envoyez-le sur le téléphone pour le suivre pendant une course.</p>`}</div></div></div></div>`;
}

/* ----- activity page additions ----- */
function vActs() {

  const who = S.scope === "mine" ? active : S.scope;

  if (who === "all") for (const x of all) { const same = x.a[6] && items.find(y => y.a[6] === x.a[6]); same ? same.owners.push(x.owners[0]) : items.push({ a: x.a, owners: [...x.owners] }); }
  items.sort((x, y) => y.a[5] - x.a[5]);

  return `<div class="spread"><div><h1>Activités</h1><p class="muted" style="margin-top:6px">Toutes les courses du foyer, quel que soit le profil actif. Les statistiques, records et segments restent personnels.</p></div><button type="button" class="btn primary" data-act="toast" data-v="Ouvre l'écran d'import existant : le fichier va dans le profil actif">${ic("upload")}Importer</button></div>
  <div class="row" style="justify-content:space-between"><div class="row" role="group" aria-label="Filtrer par personne">${chips.map(c => `<button type="button" class="fchip" data-act="scope" data-v="${c[0]}" aria-pressed="${S.scope === c[0]}">${c[0] === "all" ? ic("users", 16) : av(PROFILES.find(p => p.id === (c[0] === "mine" ? active : c[0])))}${c[1]}</button>`).join("")}</div><span class="muted small">${items.length} courses · <b class="num">${dec(km)} km</b> en novembre</span></div>
  ${items.length ? `<div class="libs">${items.map(x => `<button type="button" class="lib" data-act="openact"><span class="thumb" style="background:var(--p-lav)">${trace(TR[x.a[3]], "var(--pace-fast)", 7)}<span class="owners">${x.owners.map(av).join("")}<span>${x.owners.map(p => p.name).join(" et ")}</span></span></span><h3>${x.a[0]}</h3><span class="mini"><span>${x.a[5]} nov.</span><span><b>${x.a[1]}</b> km</span><span><b>${x.a[2]}</b></span></span><span class="row">${x.a[4].map(t => `<span class="tag lav">${t}</span>`).join("")}${x.owners.length > 1 ? `<span class="tag mint">Course à deux</span>` : ""}</span></button>`).join("")}</div>` : `<div class="emptybox"><div class="big">${ic("list", 28)}</div><h2>Aucune course pour cette personne</h2><button type="button" class="btn" data-act="scope" data-v="all">Voir tout le foyer</button></div>`}
  <div class="note">${ic("info", 18)}<span>Le filtre est retenu sur l'appareil. « Mes activités » suit le profil actif : changez de profil et la liste suit. Ouvrez « Fractionné 6 × 400 m » pour voir ce qui s'ajoute à la page d'une course.</span></div>`;
}

  <div class="note">${ic("info", 18)}<span>Seuls les blocs ajoutés par ce changement sont montrés ici. La carte, le graphique, les zones, le journal et les tours restent ceux de la page déjà approuvée.</span></div>
  <div class="card"><div class="card-h"><h2>Records dans cette course</h2><button type="button" class="switch" data-act="exclude" aria-pressed="${S.excluded}"><span class="tr"></span>Exclure des records</button></div><div class="card-b">${S.excluded ? `<div class="note butter">${ic("eye-off", 18)}<span>Cette course est exclue des records et des prédictions. Ses temps ne comptent plus ; le record précédent est rétabli.</span></div>` : `<div class="row"><span class="tile t-butter" style="flex-direction:row;align-items:center;gap:12px;padding:12px 16px"><span class="medal m1">1</span><span><b>Record sur 400 m</b><br><span class="num" style="font-size:22px;font-weight:600">1:38</span> <span class="small muted">entre 3,42 et 3,82 km</span></span></span><span class="tile t-lav" style="flex-direction:row;align-items:center;gap:12px;padding:12px 16px"><span class="medal m1">1</span><span><b>Record sur 1 km</b><br><span class="num" style="font-size:22px;font-weight:600">4:52</span> <span class="small muted">entre 3,10 et 4,10 km</span></span></span><span class="tile" style="background:var(--surface-2);flex-direction:row;align-items:center;gap:12px;padding:12px 16px"><span class="medal m3">3</span><span><b>3ᵉ temps sur 5 km</b><br><span class="num" style="font-size:22px;font-weight:600">29:02</span></span></span></div><p class="small muted" style="margin-top:10px">Survoler un record surligne sa portion sur la carte et le graphique. Le classement est celui d'aujourd'hui : il change si un temps est battu plus tard.</p>`}</div></div>

    <div class="col">

      <div class="card"><div class="card-h"><h2>Parcours et allure cible</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:10px"><a href="#" class="prow" data-act="route" data-v="r1"><span class="th">${trace(TR.canal, "var(--i-sky)", 10)}</span><span class="grow"><b>Boucle du canal</b><br><span class="small muted">Parcours suivi pendant la course</span></span>${ic("chev", 16)}</a><div class="tile t-mint"><div class="top"><span class="chip">${ic("gauge", 16)}</span>Allure cible · ajustée à la pente</div><div class="v">0:35 <small>d'avance</small></div><div class="s">Objectif 58:00 sur le parcours · arrivée en 57:25 · objectif tenu</div></div></div></div>
    </div>
  </div>`;
}

const vSettings = () => `<h1>Réglages</h1><div class="emptybox"><div class="big">${ic("sliders", 28)}</div><h2>Inchangés</h2><p>Profil, zones cardiaques, unités et apparence restent ceux de l'application actuelle. Rien n'est ajouté ici par ce changement.</p></div>`;

/* ---------- render ---------- */
function render() {
  const v = { progress: vProgress, segments: vSegments, plan: vPlan, acts: vActs, settings: vSettings }[S.view]();
  $("#main").innerHTML = v + `<footer>Prototype de direction artistique : données fictives, fonds de carte stylisés. Rien n'est enregistré ; les sélecteurs « État montré » n'existent que dans la maquette.</footer>`;
  document.querySelectorAll(".navlink").forEach(a => a.dataset.v === S.view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.querySelectorAll('[data-act="theme"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === theme));
  const me = PROFILES.find(p => p.id === active);
  document.querySelectorAll("[data-avatar]").forEach(a => { a.textContent = me.name[0]; a.style.background = me.color; });
  document.querySelectorAll("[data-pname]").forEach(a => (a.textContent = me.name));
  wireRoute();
}
function profileSheet() {
  $("#sheet").innerHTML = `<h2>Profils du foyer</h2><p class="muted small">Tout ce qui est affiché — activités, progression, segments, séances et parcours — appartient au profil choisi.</p>${PROFILES.map(p => `<button type="button" class="pick" data-act="pickprofile" data-v="${p.id}" aria-pressed="${p.id === active}"><span class="avatar" style="background:${p.color}">${p.name[0]}</span><span style="flex:1">${p.name}<small>${p.sub}</small></span>${p.id === active ? ic("check") : ""}</button>`).join("")}<button type="button" class="btn" data-act="closemodal" style="align-self:flex-end">Fermer</button>`;
  $("#modal").classList.add("on");
}
function wireRoute() {
  const p = $("#rprof"); if (!p) return;
  const r = ROUTES.find(x => x.id === S.route), path = $("#rmap path:last-of-type"), dot = $("#rdot"), cur = $("#rcur"), lab = $("#rlab"), len = path.getTotalLength();
  const move = e => { const b = p.getBoundingClientRect(), t = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)), pt = path.getPointAtLength(t * len); dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y); dot.setAttribute("visibility", "visible"); cur.setAttribute("x1", t * 640); cur.setAttribute("x2", t * 640); cur.setAttribute("visibility", "visible"); const i = Math.round(t * (r.ele.length - 1)); lab.textContent = `${dec(t * r.km)} km · ${Math.round(r.ele[i])} m`; lab.setAttribute("x", Math.min(520, t * 640 + 8)); };
  p.addEventListener("pointermove", move); p.addEventListener("pointerdown", move);
  p.addEventListener("pointerleave", () => { dot.setAttribute("visibility", "hidden"); cur.setAttribute("visibility", "hidden"); lab.textContent = ""; });
}
let toastT;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2600); }
const clone = o => JSON.parse(JSON.stringify(o));
const at = p => { const [i, j] = String(p).split(".").map(Number); return j == null || isNaN(j) ? [S.draft.items, i] : [S.draft.items[i].steps, j]; };
const parseT = s => { const m = /^(\d+):(\d{1,2})$/.exec(s.trim()); return m ? +m[1] * 60 + +m[2] : /^\d+$/.test(s.trim()) ? +s * 60 : NaN; };
function keepNames() { if (S.draft) { const n = $("#wname"), o = $("#wnote"); if (n) S.draft.name = n.value; if (o) S.draft.note = o.value; } }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  const a = el.dataset.act, v = el.dataset.v, p = el.dataset.p;
  keepNames();
  if (a === "seg" && !SEGMENTS.some(s => s.id === v) || a === "route" && !ROUTES.some(r => r.id === v)) { toast("Cet élément appartient à un autre profil dans la maquette"); return; }
  switch (a) {
    case "profiles": profileSheet(); return;
    case "closemodal": $("#modal").classList.remove("on"); return;
    case "pickprofile": switchProfile(v); $("#modal").classList.remove("on"); toast(`Profil actif : ${PROFILES.find(p => p.id === v).name}`); window.scrollTo(0, 0); break;
    case "nav": Object.assign(S, { view: v, seg: null, route: null, draft: null, act: false, renaming: false }); window.scrollTo(0, 0); break;
    case "theme": theme = v; v === "system" ? root.removeAttribute("data-theme") : root.setAttribute("data-theme", v); break;
    case "tab": S.tab = v; break;
    case "scope": S.scope = v; break;
    case "year": S.year = +v; S.day = null; break;
    case "measure": S.measure = v; break;
    case "day": S.day = v; break;
    case "vol": S.vol = v; break;
    case "tag": S.tag = v; break;
    case "rec": S.rec = +v; break;
    case "predDemo": S.predDemo = v; break;
    case "loadDemo": S.loadDemo = v; break;
    case "segDemo": S.segDemo = v; break;
    case "segSort": S.segSort = v; break;
    case "hidden": S.hidden = !S.hidden; break;
    case "seg": Object.assign(S, { view: "segments", seg: v, act: false, renaming: false }); window.scrollTo(0, 0); break;
    case "segback": S.seg = null; break;
    case "rename": S.renaming = true; break;
    case "renameok": SEGMENTS.find(s => s.id === S.seg).name = $("#rename").value.trim() || SEGMENTS.find(s => s.id === S.seg).name; S.renaming = false; toast("Segment renommé"); break;
    case "hide": SEGMENTS.find(s => s.id === v).hidden = true; S.seg = null; toast("Segment masqué : il ne reviendra pas tout seul"); break;
    case "restore": e.stopPropagation(); SEGMENTS.find(s => s.id === v).hidden = false; toast("Segment rétabli, avec tous ses passages"); break;
    case "planTab": S.planTab = v; break;
    case "route": Object.assign(S, { view: "plan", planTab: "routes", route: v, act: false, draft: null }); window.scrollTo(0, 0); break;
    case "routeback": S.route = null; break;
    case "phone": { const o = (el.dataset.k === "w" ? WORKOUTS : ROUTES).find(x => x.id === v); o.phone = o.phone.state === "none" ? { state: "wait" } : { state: "none" }; toast(o.phone.state === "wait" ? "Marqué pour le téléphone : il l'aura à la prochaine synchro à la maison" : "Retiré : il quittera le téléphone à la prochaine synchro"); break; }
    case "neww": S.draft = { id: null, name: "", note: "", items: [st("warmup", "time", 600)] }; break;
    case "editw": S.draft = clone(WORKOUTS.find(w => w.id === v)); break;
    case "dupw": { const w = clone(WORKOUTS.find(x => x.id === v)); w.id = "w" + Date.now(); w.name += " (copie)"; w.phone = { state: "none" }; WORKOUTS.push(w); toast("Séance dupliquée"); break; }
    case "delw": WORKOUTS = WORKOUTS.filter(w => w.id !== v); toast("Séance supprimée : les courses déjà faites avec elle gardent leurs étapes"); break;
    case "addstarter": WORKOUTS.push({ id: "w" + Date.now(), name: STARTERS[v].name, note: "", phone: { state: "none" }, items: clone(STARTERS[v].items) }); toast("Ajoutée à vos séances"); break;
    case "canceled": S.draft = null; break;
    case "addstep": (p === "" ? S.draft.items : S.draft.items[+p].steps).push(st("effort", "time", 60)); break;
    case "addrep": S.draft.items.push({ type: "repeat", count: 4, skipLast: false, steps: [st("effort", "dist", 400, pz(300, 315)), st("recovery", "time", 90)] }); break;
    case "rm": { const [arr, i] = at(p); arr.splice(i, 1); break; }
    case "mv": { const [arr, i] = at(p), j = i + +v; if (j >= 0 && j < arr.length) [arr[i], arr[j]] = [arr[j], arr[i]]; break; }
    case "cnt": { const it = S.draft.items[+p]; it.count = Math.max(2, Math.min(50, it.count + +v)); break; }
    case "skip": S.draft.items[+p].skipLast = !S.draft.items[+p].skipLast; break;
    case "savew": {
      const w = S.draft;
      if (!w.name.trim()) { w.error = "Donnez un nom à la séance."; break; }
      if (!unfold(w.items).length) { w.error = "Une séance a besoin d'au moins une étape."; break; }
      delete w.error;
      if (w.id) { const i = WORKOUTS.findIndex(x => x.id === w.id); if (w.phone.state === "ok") w.phone = { state: "wait" }; WORKOUTS[i] = w; } else { w.id = "w" + Date.now(); w.phone = { state: "none" }; WORKOUTS.push(w); }
      S.draft = null; toast("Séance enregistrée"); break;
    }
    case "openact": Object.assign(S, { view: "acts", act: true, seg: null, route: null, draft: null }); window.scrollTo(0, 0); break;
    case "actback": S.act = false; break;
    case "exclude": S.excluded = !S.excluded; break;
    case "toast": toast(v); return;
  }
  render();
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-ed]"); if (!el) return;
  keepNames();
  const [arr, i] = at(el.dataset.p), s = arr[i], k = el.dataset.ed, val = el.value;
  if (k === "kind") s.kind = val;
  else if (k === "endt") s.end = { t: val, v: val === "time" ? 60 : val === "dist" ? 400 : 0 };
  else if (k === "endv") {
    const n = s.end.t === "time" ? parseT(val) : parseInt(val, 10);
    const ok = s.end.t === "time" ? n >= 5 && n <= 21600 : n >= 50 && n <= 100000;
    if (ok) { s.end.v = n; delete S.draft.error; } else S.draft.error = s.end.t === "time" ? "Une durée va de 0:05 à 6 heures (format min:s)." : "Une distance va de 50 m à 100 km.";
  }
  else if (k === "tt") s.target = val === "pace" ? pz(300, 315) : val === "zone" ? zn(2) : { t: "none" };
  else if (k === "lo" || k === "hi") { const n = parseT(val); if (n > 0) { s.target[k] = n; if (s.target.lo > s.target.hi) { [s.target.lo, s.target.hi] = [s.target.hi, s.target.lo]; toast("Bornes remises dans l'ordre : la plus rapide d'abord"); } } }
  else if (k === "z") s.target.z = +val;
  render();
});
document.addEventListener("mouseover", e => { const b = e.target.closest('.heat [data-act="day"]'); if (b && S.day !== b.dataset.v && matchMedia("(hover:hover)").matches) { S.day = b.dataset.v; const box = $(".daybox"); if (box) { const data = YEARS[S.year], sel = data.find(x => x.d.toDateString() === S.day); box.innerHTML = sel ? `<b>${fdate(sel.d)}</b>${sel.runs.map(r => `<a href="#" class="tag lav" data-act="openact">${r.title} · ${dec(r.km)} km</a>`).join("")}<span class="muted small">${sel.runs.length > 1 ? `Total du jour : ${dec(sum(sel.runs, r => r.km))} km` : dur(sel.runs[0].min * 60)}</span>` : `<b>${fdate(new Date(S.day))}</b><span class="muted">Repos.</span>`; } } });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") e.target.classList.remove("on"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").classList.remove("on"); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr[data-act]")) e.target.click(); });
render();
})();
</script>
</body>
