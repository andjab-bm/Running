name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build
          include-hidden-files: true

  server:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # The server embeds the built web app, so tests run against the real bundle.
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The hosted runner ships the Android SDK; the build installs missing packages.
      - run: ./gradlew :core:test
      - run: ./gradlew :phone:testDebugUnitTest :phone:lintDebug
      - run: ./gradlew :phone:assembleDebug :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            android/phone/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/debug/*.apk
