name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the image be built and published from any branch, from the Actions tab.
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build
          include-hidden-files: true

  server:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # The server embeds the built web app, so tests run against the real bundle.
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web/build
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Browser tests: the real server on an empty data directory, driven through the built web app.
  e2e:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web/build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Compiled here so the test run itself only has to start the server.
      - run: cargo build --manifest-path ../server/Cargo.toml
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  # The container image, for both architectures (the ARM64 server is cross-compiled, nothing is
  # emulated). Pull requests only build it; a push to main or a manual run also publishes it to
  # the GitHub Container Registry, where the Raspberry Pi can pull it (see docs/deployment.md).
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image name and tags
        id: meta
        run: |
          # Registry names are lower-case; the repository name may not be.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source cache on actions/cache, as before; v6 defaults to a proprietary one.
          cache-provider: basic
      # The hosted runner ships the Android SDK; the build installs missing packages.
      - run: ./gradlew :core:test
      - run: ./gradlew :phone:testDebugUnitTest :phone:lintDebug
      - run: ./gradlew :phone:assembleDebug :wear:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: |
            android/phone/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/debug/*.apk
